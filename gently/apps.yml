tools:
  - nodejs_22

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock_tracker
    connectionEnv:
      DATABASE_URL: postgresql://stock:stock@postgres:5432/stock_tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_tracker"]
      interval: 2s
      timeout: 3s
      retries: 15

apps:
  api:
    port: 3001
    routes:
      - path: /api
    env:
      JWT_SECRET: dev-secret-not-for-prod
    setup:
      - npm install
      - npm run db:setup
    startup:
      - npm run dev
    health:
      - endpoint: /api/health
